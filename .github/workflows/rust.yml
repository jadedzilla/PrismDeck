name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Install system dependencies needed for native crates (ALSA, pkg-config)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libasound2-dev libudev-dev

    # Install Rust toolchain
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    # Cache cargo registry, git index and build outputs to speed up CI
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build (release)
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Upload release binary
      uses: actions/upload-artifact@v4
      with:
        name: prismdeck-launcher
        path: target/release/prismdeck-launcher
